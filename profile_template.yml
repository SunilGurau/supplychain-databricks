# This file defines prompts with defaults for dbt initializaton.
# It is used when the `dbt init` command is invoked.
#
fixed:
  type: databricks
prompts:
  host:
    default: dbc-db9b6af0-e8db.cloud.databricks.com
  token:
    hint: 'personal access token to use, dapiXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXX'
    hide_input: true
  http_path:
    hint: 'HTTP path of SQL warehouse to use'
    default: /sql/1.0/warehouses/32dc95bae68c1cc1
  catalog:
    hint: 'initial catalog'
    default: workspace
  schema:
    hint: 'personal schema where dbt will build objects during development, example: sunil2000_babu'
  threads:
    hint: 'threads to use during development, 1 or more'
    type: 'int'
    default: 4
