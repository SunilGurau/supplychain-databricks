# This file defines the structure of this project and how it is deployed
# to production using Declarative Automation Bundles.
# See https://docs.databricks.com/dev-tools/bundles/index.html for documentation.
bundle:
  name: supplychain-analytics
  uuid: 80fc092a-4852-4b01-a711-879b3b368582

include:
  - resources/*.yml

# Deployment targets.
# The default schema, catalog, etc. for dbt are defined in dbt_profiles/profiles.yml
targets:
  dev:
    # The default target uses 'mode: development' to create a development copy.
    # - Deployed resources get prefixed with '[dev my_user_name]'
    # - Any job schedules and triggers are paused by default.
    # See also https://docs.databricks.com/dev-tools/bundles/deployment-modes.html.
    mode: development
    default: true
    workspace:
      host: https://dbc-db9b6af0-e8db.cloud.databricks.com

  prod:
    mode: production
    workspace:
      host: https://dbc-db9b6af0-e8db.cloud.databricks.com
      # We explicitly deploy to /Workspace/Users/sunil2000.babu@gmail.com to make sure we only have a single copy.
      root_path: /Workspace/Users/sunil2000.babu@gmail.com/.bundle/${bundle.name}/${bundle.target}
    permissions:
      - user_name: sunil2000.babu@gmail.com
        level: CAN_MANAGE
